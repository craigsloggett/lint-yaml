name: Lint YAML Files

description: A composite action for linting YAML files.

inputs:
  python-version:
    description: The version of Python to use when running `yamllint`.
    default: 3.14.5
    required: false

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install yamllint
      run: |
        pip install --upgrade pip
        pip install yamllint
      shell: sh

    - name: Lint YAML Files
      run: |-
        yamllint .
      shell: sh
