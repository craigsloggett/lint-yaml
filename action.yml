name: Lint YAML Files

description: A composite action for linting YAML files.

inputs:
  python-version:
    description: The version of Python to use when running `yamllint`.
    default: 3.14.5
    required: false
  strict:
    description: Whether to run `yamllint` with `--strict` or not.
    default: false
    required: false

runs:
  using: composite
  steps:
    - name: Validate Strict Input
      env:
        STRICT: ${{ inputs.strict }}
      run: |-
        case "${STRICT}" in
          true | false)
          ;;
          *)
          printf '%s\n' "::error::Input 'strict' must be 'true' or 'false', got '${STRICT}'"
          exit 1
          ;;
        esac
      shell: sh

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install yamllint
      run: |
        pip install --upgrade pip
        pip install yamllint
      shell: sh

    - name: Lint YAML Files
      run: |-
        yamllint ${{ inputs.strict == 'true' && '--strict' || '' }} .
      shell: sh
